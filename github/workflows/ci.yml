
name: Django CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_order_payment
          POSTGRES_USER: django_app
          POSTGRES_PASSWORD: postgres_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_app -d django_order_payment"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      WEBHOOK_SECRET: ci-only-webhook-secret
      DB_NAME: django_order_payment
      DB_USER: django_app
      DB_PASSWORD: postgres_ci_pass
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_CACHE_URL: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python -m pytest -q
